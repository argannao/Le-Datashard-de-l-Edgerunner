# Publie le site sur GitHub Pages à chaque push sur main.
# Avant publication, le numéro de version des CSS/JS (?v=...) est remplacé
# par l'identifiant du commit : les navigateurs rechargent donc toujours
# les fichiers modifiés, sans rien changer à la main.
name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Version des assets = commit
        run: |
          V="${GITHUB_SHA::10}"
          sed -i -E "s/\?v=[A-Za-z0-9]+/?v=${V}/g" *.html
          grep -ho "?v=[A-Za-z0-9]*" *.html | sort | uniq -c

      - name: Préparer le site
        run: |
          mkdir _site
          cp -r *.html assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
